<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>presmae</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://www.transparenttextures.com/patterns/film.png');
            background-size: cover;
        }
        .container { text-align: center; }
        h1 { font-family: 'Impact', sans-serif; font-size: 48px; margin-bottom: 10px; }
        p.tagline { font-size: 20px; margin-bottom: 40px; color: #ccc; }
        .nav-buttons a {
            display: inline-block;
            margin: 0 20px;
            padding: 15px 30px;
            background: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            transition: background 0.3s;
        }
        .nav-buttons a:hover { background: #0056b3; }
        .logout-icon {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: #FF4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>presmae</h1>
        <p class="tagline">Plan the Perfect Flick with Friends</p>
        <div class="nav-buttons">
            <a href="create_poll.html">Create Movie Poll</a>
            <a href="trailer.html">Trailer Shuffle</a>
        </div>
    </div>
    <div class="logout-icon" onclick="logout()">🚪</div>

    <script>
        if (!localStorage.getItem("loggedIn")) {
            window.location.href = "login.html";
        }

        function logout() {
            localStorage.removeItem("loggedIn");
            alert("Logged out!");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
