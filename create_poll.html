<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Poll</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; }
        .movie-group { margin-bottom: 20px; }
        input { margin: 5px; padding: 8px; width: 100%; max-width: 300px; background: #1e1e1e; color: white; border: 1px solid #333; }
        button { margin: 5px; padding: 8px 16px; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #pollLink { margin-top: 20px; padding: 10px; background: #1e1e1e; border-radius: 4px; }
        #pollLink a { color: #00BFFF; text-decoration: none; }
        #pollLink a:hover { text-decoration: underline; }
        .suggestions, .suggested-trailers { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            margin-top: 20px; 
            max-width: 600px; 
            margin-left: auto; 
            margin-right: auto; 
        }
        .suggestion, .trailer { width: 120px; cursor: pointer; }
        .suggestion img, .trailer img { width: 100%; border-radius: 4px; }
        .suggestion p, .trailer p { font-size: 12px; margin: 5px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .trailer button { background: #ff4444; padding: 4px 8px; font-size: 12px; }
        .trailer button:hover { background: #cc0000; }
        #savedMovies { margin: 20px 0; }
        .saved-movie { display: inline-block; margin: 5px; padding: 5px 10px; background: #333; border-radius: 4px; cursor: pointer; }
        .saved-movie:hover { background: #555; }
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); 
            justify-content: center; align-items: center; 
        }
        .modal iframe { width: 640px; height: 360px; }
        .modal button { position: absolute; top: 10px; right: 10px; background: #ff4444; }
        a { color: #00BFFF; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create a Movie Poll</h1>
        <div id="movies">
            <div class="movie-group">
                <input type="text" class="movie-input" placeholder="Movie 1" required oninput="fetchInputSuggestions(this)">
                <div class="suggestions"></div>
            </div>
        </div>
        <button onclick="addMovieInput()">Add Another Movie</button>
        <button onclick="createPoll()">Create Poll</button>
        <div id="pollLink"></div>
        <div id="savedMovies"></div>
        <h2>Suggested Trailers</h2>
        <div class="suggested-trailers" id="suggestedTrailers"></div>
        <p><a href="index.html">Back to Home</a></p>
    </div>

    <div id="trailerModal" class="modal">
        <iframe id="trailerFrame" frameborder="0" allowfullscreen></iframe>
        <button onclick="closeModal()">Close</button>
    </div>

    <script>
        const YOUTUBE_API_KEY = 'AIzaSyAcLUEZvESstj_6CU-oW2CtYgHrKzw27zg';
        let savedMovies = [];

        function addMovieInput() {
            const moviesDiv = document.getElementById('movies');
            const movieGroup = document.createElement('div');
            movieGroup.className = 'movie-group';
            movieGroup.innerHTML = `
                <input type="text" class="movie-input" placeholder="Movie ${moviesDiv.children.length + 1}" required oninput="fetchInputSuggestions(this)">
                <div class="suggestions"></div>
            `;
            moviesDiv.appendChild(movieGroup);
        }

        async function fetchInputSuggestions(inputElement) {
            const query = inputElement.value.trim();
            const suggestionsDiv = inputElement.nextElementSibling;
            suggestionsDiv.innerHTML = '';
            if (query.length < 2) return;

            try {
                const response = await fetch(
                    `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=${encodeURIComponent(query + ' trailer')}&maxResults=20&key=${YOUTUBE_API_KEY}`
                );
                if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                const data = await response.json();
                if (!data.items) return;

                data.items.slice(0, 20).forEach(item => {
                    const suggestion = document.createElement('div');
                    suggestion.className = 'suggestion';
                    suggestion.innerHTML = `
                        <img src="${item.snippet.thumbnails.default.url}" alt="${item.snippet.title}">
                        <p>${item.snippet.title}</p>
                    `;
                    suggestion.onclick = () => {
                        inputElement.value = item.snippet.title.replace(/ - Official Trailer.*/i, '');
                        suggestionsDiv.innerHTML = '';
                    };
                    suggestionsDiv.appendChild(suggestion);
                });
            } catch (error) {
                suggestionsDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }

        async function fetchSuggestedTrailers() {
            const suggestedDiv = document.getElementById('suggestedTrailers');
            try {
                const response = await fetch(
                    `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=popular%20movie%20trailers%202023&maxResults=20&key=${YOUTUBE_API_KEY}`
                );
                if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                const data = await response.json();
                if (!data.items) return;

                suggestedDiv.innerHTML = '';
                data.items.slice(0, 20).forEach(item => {
                    const trailer = document.createElement('div');
                    trailer.className = 'trailer';
                    trailer.innerHTML = `
                        <img src="${item.snippet.thumbnails.default.url}" alt="${item.snippet.title}">
                        <p>${item.snippet.title}</p>
                        <button onclick="saveToVoting('${item.snippet.title.replace(/ - Official Trailer.*/i, '')}')">Save to Voting</button>
                    `;
                    trailer.querySelector('img').onclick = () => showTrailer(item.id.videoId);
                    suggestedDiv.appendChild(trailer);
                });
            } catch (error) {
                suggestedDiv.innerHTML = `<p>Error loading suggestions: ${error.message}</p>`;
            }
        }

        function showTrailer(videoId) {
            const modal = document.getElementById('trailerModal');
            const frame = document.getElementById('trailerFrame');
            frame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('trailerModal');
            const frame = document.getElementById('trailerFrame');
            frame.src = '';
            modal.style.display = 'none';
        }

        function saveToVoting(movieTitle) {
            if (!savedMovies.includes(movieTitle)) {
                savedMovies.push(movieTitle);
                updateSavedMovies();
            }
        }

        function updateSavedMovies() {
            const savedDiv = document.getElementById('savedMovies');
            savedDiv.innerHTML = '<h3>Saved Movies</h3>';
            savedMovies.forEach(movie => {
                const span = document.createElement('span');
                span.className = 'saved-movie';
                span.textContent = movie;
                span.onclick = () => addToInput(movie);
                savedDiv.appendChild(span);
            });
        }

        function addToInput(movie) {
            const inputs = document.getElementsByClassName('movie-input');
            for (let input of inputs) {
                if (!input.value) {
                    input.value = movie;
                    return;
                }
            }
            addMovieInput();
            document.getElementsByClassName('movie-input')[inputs.length].value = movie;
        }

        async function createPoll() {
            const movieInputs = document.getElementsByClassName('movie-input');
            const movies = Array.from(movieInputs).map(input => input.value.trim()).filter(val => val);

            if (movies.length === 0) {
                alert('Please enter at least one movie.');
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/create-poll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ movies })
                });
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`Poll creation failed: ${text}`);
                }
                const data = await response.json();
                document.getElementById('pollLink').innerHTML = `
                    Share this link: <a href="${data.summaryLink}" target="_blank">${data.summaryLink}</a>
                `;
            } catch (error) {
                alert('Error creating poll: ' + error.message);
            }
        }

        fetchSuggestedTrailers();
    </script>
</body>
</html>
