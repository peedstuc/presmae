<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trailer Shuffle</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
        }
        .trailer-container {
            position: relative;
            width: 100%;
            max-width: 360px; /* Shorts-like width */
            aspect-ratio: 9 / 16; /* 9:16 vertical aspect ratio */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-family: Arial, sans-serif;
        }
        .next-btn {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff0000; /* Red like YouTube */
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }
        .next-btn:hover {
            background: #cc0000; /* Darker red on hover */
        }
        .home-icon {
            position: absolute;
            top: 20px; /* Top-left corner */
            left: 20px;
            width: 40px;
            height: 40px;
            background: #00BFFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            text-decoration: none;
            color: white;
        }
        .home-icon:hover {
            background: #008CBA; /* Slightly darker on hover */
        }
    </style>
</head>
<body>
    <div class="trailer-container">
        <iframe id="trailer" allowfullscreen></iframe>
        <div id="loading" class="loading">Loading trailers...</div>
        <button class="next-btn" onclick="playNextVideo()">Next</button>
    </div>
    <a href="index.html" class="home-icon">🏠</a>
    
    <script>
        const YOUTUBE_API_KEY = 'AIzaSyAcLUEZvESstj_6CU-oW2CtYgHrKzw27zg';
        const trailerFrame = document.getElementById("trailer");
        const loadingDiv = document.getElementById("loading");
        const hashtags = ['#movieshorts', '#movietrailers', '#clips'];
        let videos = [];
        let timeoutId = null;

        async function fetchVideos(hashtag) {
            try {
                const response = await fetch(
                    `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=${encodeURIComponent(hashtag)}&maxResults=20&key=${YOUTUBE_API_KEY}`
                );
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                return data.items.map(item => ({
                    videoId: item.id.videoId,
                    title: item.snippet.title
                }));
            } catch (error) {
                console.error(`Error fetching ${hashtag}:`, error);
                return [];
            }
        }

        async function loadVideos() {
            const videoPromises = hashtags.map(hashtag => fetchVideos(hashtag));
            const videoArrays = await Promise.all(videoPromises);
            videos = [].concat(...videoArrays).filter(v => v.videoId);
            if (videos.length > 0) {
                playNextVideo();
            } else {
                loadingDiv.textContent = "No videos found.";
            }
        }

        function playNextVideo() {
            if (timeoutId) clearTimeout(timeoutId);
            const index = Math.floor(Math.random() * videos.length);
            const video = videos[index];
            trailerFrame.src = `https://www.youtube.com/embed/${video.videoId}?autoplay=1&mute=0`;
            loadingDiv.style.display = "none";
            console.log(`Playing: ${video.title}`);
            timeoutId = setTimeout(playNextVideo, 120000); // 2 minutes
        }

        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowDown") {
                event.preventDefault();
                playNextVideo();
            }
        });

        trailerFrame.addEventListener("load", () => {
            if (!timeoutId) {
                timeoutId = setTimeout(playNextVideo, 120000);
            }
        });

        loadVideos();
    </script>
</body>
</html>
